<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Live demo of the Style guide checker, a free Claude skill from saturday content. Invented data for a fictional company.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Style guide checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: paper page, one working column; each step is a numbered rail; picks scroll sideways as card rows; output sits in an outlined "window". */
:root{
  --bg:#efede8; --surface:#f5f4f0; --surface-2:#e6e3dc; --ink:#141413; --muted:#55534d; --faint:#8d8a82; --line:#d3d0c8; --dot:#b9b5ab;
  --hl:#ffb800; --hl-ink:#141413; --hl-soft:#fbe6ad; --bad:#b4442c; --bad-soft:#f3dcd3; --good:#2f7a4d;
  --shadow-c:#141413;
  --f-body:"Host Grotesk","Helvetica Neue",Arial,sans-serif; --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161614; --surface:#1d1c1a; --surface-2:#282723; --ink:#efede8; --muted:#aeaaa0; --faint:#8a867d; --line:#35332f; --dot:#3d3b36;
  --hl:#ffb800; --hl-ink:#141413; --hl-soft:#3a2f12; --bad:#f08a6e; --bad-soft:#3a201a; --good:#7fc79b; --shadow-c:#000000; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#161614; --surface:#1d1c1a; --surface-2:#282723; --ink:#efede8; --muted:#aeaaa0; --faint:#8a867d; --line:#35332f; --dot:#3d3b36;
  --hl:#ffb800; --hl-ink:#141413; --hl-soft:#3a2f12; --bad:#f08a6e; --bad-soft:#3a201a; --good:#7fc79b; --shadow-c:#000000; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,44px);letter-spacing:-.04em;line-height:1.05}
h2{font-size:22px;letter-spacing:-.03em}
h3{font-size:16px;letter-spacing:-.02em;font-weight:600}
.hl{background:var(--hl);color:var(--hl-ink);padding:0 .12em;border-radius:3px}
.mono-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

.brandbar{border-bottom:1px solid var(--line)}
.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.03em;text-decoration:none}
.logo span{background:var(--hl);color:var(--hl-ink);padding:0 4px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hl)}

header.head .wrap{padding-block:36px 8px;display:grid;gap:12px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.lede{font-size:18px;line-height:1.4;letter-spacing:-.01em;color:var(--muted);max-width:60ch;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:6px;padding:5px 10px;font-family:var(--f-mono);font-size:12px;background:var(--bg)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.live .dot{background:var(--hl);box-shadow:0 0 0 1.5px var(--ink)}
nav.views{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:18px}
nav.views button{border:0;background:none;padding:12px 0 9px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-bottom:1.5px solid transparent}
nav.views button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
nav.views button:hover{color:var(--ink)}

main{padding-block:28px 64px}
.q{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.04em;font-weight:700;margin:0 0 18px}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.mode{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 14px 16px;display:grid;gap:8px;align-content:start}
.mode:hover{border-color:var(--ink)}
.mode[aria-pressed=true]{border:1.5px solid var(--ink);background:var(--hl);color:var(--hl-ink);box-shadow:4px 4px 0 var(--shadow-c)}
.mode[aria-pressed=true] .mdesc{color:var(--hl-ink)}
.mode .ic{width:26px;height:26px}
.mode .mname{font-weight:700;font-size:19px;letter-spacing:-.03em}
.mode .mdesc{font-size:13px;color:var(--muted);line-height:1.4}
.mode .tick{position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint)}
.mode[aria-pressed=true] .tick{border-color:var(--hl-ink);background:var(--hl-ink);box-shadow:inset 0 0 0 3px var(--hl)}

.steps{list-style:none;margin:30px 0 0;padding:0;display:grid}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:30px}
.step::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:1.5px;background:var(--line)}
.step:last-child::before{display:none}
.num{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--bg);position:relative}
.step.done .num{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.step-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;min-height:34px;padding-top:4px}
.step-h h3{font-size:19px;letter-spacing:-.03em;font-weight:700}
.step-h .sub{display:block;margin-top:2px}
.opt-note{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.step-b{grid-column:2;margin-top:12px;min-width:0}
.rowwrap{position:relative}
.cards{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);padding-right:40px!important;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 6px 10px 2px;scrollbar-width:thin}
.opt{scroll-snap-align:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;min-height:132px;position:relative}
.opt:hover{border-color:var(--ink)}
.opt .ib{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.opt .ib svg{width:20px;height:20px}
.opt .on{font-weight:600;letter-spacing:-.01em;line-height:1.25}
.opt .od{font-size:13px;color:var(--muted);line-height:1.35}
.opt[aria-pressed=true]{border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-c);background:var(--bg)}
.opt[aria-pressed=true] .ib{background:var(--hl);color:var(--hl-ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-pressed=true]::after{content:"Selected";position:absolute;right:10px;top:10px;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:2px 5px;border-radius:3px}
.funnel .opt{min-height:0}
textarea.box{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;line-height:1.5}
textarea.box:focus{outline:none;border-color:var(--ink)}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.hint.req{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.pill:hover:not(:disabled){background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.pill.ghost{background:transparent;color:var(--ink)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.gen-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.gen-note{font-size:13px;color:var(--muted);max-width:60ch}
.summary-line{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px}
.summary-line b{font-weight:500;color:var(--ink);background:var(--hl-soft);padding:0 3px}

.window{background:var(--bg);border:1.5px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--shadow-c);overflow:hidden;margin-right:6px}
.window-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1.5px solid var(--ink);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.window-bar i{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
.window-bar .wt{margin-left:4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otabs{display:flex;gap:4px}
.otabs button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.otabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.out-body{padding:20px 22px;max-height:640px;overflow:auto}
.out-empty{color:var(--muted);text-align:center;padding:28px}
.out-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.out-actions .pill{padding:8px 14px;font-size:11px}
.prose{max-width:70ch}
.prose h1,.prose h2,.prose h3,.prose h4{margin:18px 0 6px;letter-spacing:-.02em}
.prose h1{font-size:24px}.prose h2{font-size:20px}.prose h3{font-size:17px}.prose h4{font-size:15px}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose blockquote{margin:0 0 12px;padding:4px 12px;border-left:3px solid var(--hl);color:var(--muted)}
.prose code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.prose hr{border:0;border-top:1px solid var(--line);margin:16px 0}
pre.prompt{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;margin:0;line-height:1.55}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.thinking i{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--hl);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking i{animation-duration:3s}}
.msg{font-size:13px}
.msg.err{color:var(--bad)}
.ex-note{border-left:3px solid var(--hl);background:var(--surface);padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}

/* library */
.lib-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.lib-tools input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-width:min(100%,260px)}
.seg{display:flex;gap:16px}
.seg button{border:0;background:none;padding:4px 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1.5px solid transparent}
.seg button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.lib{display:grid;gap:10px}
details.aud{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.aud[open]{border-color:var(--ink);background:var(--bg)}
details.aud summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
details.aud summary::-webkit-details-marker{display:none}
details.aud .ib{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
details.aud .ib svg{width:20px;height:20px}
.dim{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:4px;padding:2px 6px}
.aud-body{padding:0 14px 16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.fld h4{margin:0 0 4px;font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld p,.fld li{margin:0;font-size:14px;line-height:1.45}
.fld ul{margin:0;padding-left:18px}
.fld.wide{grid-column:1 / -1}
.lib-note{margin-top:18px;font-size:13px;color:var(--muted);max-width:70ch}

.cta{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:18px;background-color:var(--surface-2);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:12px 12px}
.cta > div{background:var(--bg);padding:8px 12px;border-radius:6px}
footer.site{border-top:1px solid var(--line)}
footer.site .wrap{padding-block:22px}

/* style guide checker additions */
.draft-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mini:hover{border-color:var(--ink)}
.mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lint{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.lint-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.lint-head strong{font-size:15px;letter-spacing:-.01em}
.lint-sum{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-family:var(--f-mono);font-size:11px}
.rchip b{font-weight:500}
.rchip[aria-pressed=true]{border-color:var(--ink);box-shadow:2px 2px 0 var(--shadow-c)}
.rchip .sw{width:8px;height:8px;border-radius:2px;background:var(--hl)}
.rchip .sw.must{background:var(--bad)}
.rchip .sw.consider{background:var(--faint)}
.lint-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.hlview{padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.7;max-height:420px;overflow:auto;border-right:1px solid var(--line);background:var(--bg)}
.hlview mark{background:var(--hl-soft);color:inherit;border-bottom:2px solid var(--hl);padding:0 1px;border-radius:2px}
.hlview mark.must{background:var(--bad-soft);border-bottom-color:var(--bad)}
.hlview mark.consider{background:transparent;border-bottom:2px dotted var(--faint)}
.hlview .long{text-decoration:underline wavy var(--faint);text-underline-offset:4px;text-decoration-thickness:1px}
.hlview .dim-out{opacity:.45}
.hlview sup{font-family:var(--f-mono);font-size:9px;color:var(--muted);margin-left:1px}
.flags{list-style:none;margin:0;padding:6px 0;max-height:420px;overflow:auto}
.flags li{padding:8px 14px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.flags li:last-child{border-bottom:0}
.rid{font-family:var(--f-mono);font-size:11px;font-weight:500;border:1.5px solid var(--ink);border-radius:4px;padding:0 5px;height:20px;display:inline-grid;place-items:center;align-self:start}
.flags .fx{min-width:0}
.flags .ex{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
.flags .ln{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.flags .sug{color:var(--muted)}
.sev{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:var(--hl-soft);color:var(--ink)}
.sev.must{background:var(--bad-soft);color:var(--bad)}
.sev.consider{background:var(--surface-2);color:var(--muted)}
.lint-empty{padding:16px 14px;color:var(--muted);font-size:14px}
.opt .ib.idb{font-family:var(--f-mono);font-size:13px;font-weight:500}
.rulecard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin-top:12px;display:grid;gap:6px;font-size:14px}
.rulecard .rh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prose pre{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 12px;line-height:1.55}
.prose table{font-size:14px}
.wl{width:100%;border-collapse:collapse;font-size:14px}
.wl th,.wl td{text-align:left;border-bottom:1px solid var(--line);padding:6px 12px 6px 0;vertical-align:top}
.wl th{font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wl td.av{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.guide-sec{margin-top:26px}
.guide-sec h3{margin-bottom:10px}
details.aud .ib.idb{font-family:var(--f-mono);font-size:13px;font-weight:500}
</style>

<div class="brandbar" id="brandbar"><div class="wrap"><a class="logo" id="brandLink" href="https://saturdaycontent.co" target="_blank" rel="noopener">saturday <span>content</span></a><span class="tag" id="brandTag">Style guide checker · demo</span></div></div>

<header class="head">
  <div class="wrap">
    <div class="head-row">
      <div style="display:grid;gap:10px;min-width:0">
        <span class="mono-label" id="eyebrow"></span>
        <h1 id="title">Style guide <span class="hl">checker</span></h1>
      </div>
      <span class="chip" id="modeChip"><span class="dot"></span><span id="modeChipText">Checking for Claude…</span></span>
    </div>
    <p class="lede" id="lede"></p>
    <nav class="views" role="tablist">
      <button type="button" role="tab" id="v-studio" aria-selected="true" data-view="studio">Checker</button>
      <button type="button" role="tab" id="v-library" aria-selected="false" data-view="library">Style guide</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="studio" role="tabpanel" aria-labelledby="v-studio">
    <h2 class="q">What are we up to?</h2>
    <div class="modes" id="modes" role="group" aria-label="Mode"></div>
    <ol class="steps" id="steps"></ol>
  </section>
  <section id="library" role="tabpanel" aria-labelledby="v-library" hidden>
    <div class="lib-tools">
      <div class="seg" id="libSeg" role="group" aria-label="Filter" style="flex-wrap:wrap;gap:6px 16px"></div>
      <input type="search" id="libSearch" placeholder="Search rules, examples, words…" aria-label="Search the style guide">
    </div>
    <div class="lib" id="libList"></div>
    <div class="guide-sec" id="wordSec"></div>
    <p class="lib-note" id="libNote"></p>
  </section>
  <div class="cta" id="cta">
    <div><strong>Get the style guide checker skill</strong><div class="muted" style="font-size:14px">Claude loads your team's own style guide into this checker, then edits drafts against it rule by rule.</div></div>
    <a class="pill" id="ctaLink" href="https://saturdaycontent.co/templates/style-guide-checker-claude" target="_blank" rel="noopener">Get the free skill →</a>
  </div>
</main>
<footer class="site" id="siteFooter"><div class="wrap mono-label" id="footerText"></div></footer>

<script>
/* =====================================================================
   CONFIG — whose style guide this is. See CUSTOMIZE.md.
   ===================================================================== */

`## V3: Name who does what

Write in active voice, so the reader can see who acts. Passive is fine when the actor is unknown or doesn't matter.

## Why it matters

Most Fieldbook copy is about ownership: who reviews, who approves, what Fieldbook does automatically. Passive voice hides exactly that. "The draft is approved" leaves the reader asking by whom, and whether it's them.

## Do

- Your editor approves the draft, then Fieldbook moves it to **Ready**.
- Fieldbook emails each reviewer when it's their turn.
- You set the due date; Fieldbook shows it on the calendar.

function guideBlock(cats) {

}
function buildPrompt() {

  const sevAllowed = strict ? SEVERITIES.slice(0, strict.level + 1).map(s => s.id) : null;
  const flags = m.source ? lint(S.source).filter(f => (!focus || ruleOf(f.rule)?.category === focus.id) && (!sevAllowed || sevAllowed.includes(f.sev))) : [];
  const parts = [
    `You are the editor who enforces ${CONFIG.company}'s house style guide.`,
    `\nABOUT ${CONFIG.company.toUpperCase()}\n${CONFIG.about}`,
    `\nHOUSE VOICE\n${CONFIG.voice}`,
    `\nHOUSE STYLE GUIDE\nEach rule: ID [severity] (category) title. Rule. Do / Don't examples.\nSeverity: must = errors, accessibility, inclusion and brand terms; should = voice and mechanics; consider = polish.\n${guideBlock()}`,
    `\nWORD LIST (avoid → use, rule)\n${WORD_LIST.map(w => `${w.avoid} → ${w.use} (${w.rule})`).join("\n")}`,
    `\nTASK (${m.name.toUpperCase()})\n${m.task}`,
    m.id === "explain" && r ? `\nRULE TO EXPLAIN\n${r.id}: ${r.title}. ${r.rule}\nWhy (from the guide): ${r.why}\nDo: ${r.do}\nDon't: ${r.dont}` : "",
    m.source && focus ? `\nFOCUS\nOnly check rules in ${focus.name} (${focus.letter}-rules). Ignore other categories.` : "",
    m.source && strict ? `\nSTRICTNESS\nOnly report or fix issues with severity: ${sevAllowed.join(", ")}. Leave lower-severity issues alone.` : "",
    S.context.trim() ? `\nEXTRA CONTEXT FROM THE USER\n${S.context.trim()}` : "",

  $("#modes").innerHTML = MODES.map(m => `<button type="button" class="mode" aria-pressed="${m.id === S.mode}" data-mode="${m.id}"><span class="tick"></span><span class="ic">${svg(m.icon)}</span><span class="mname">${m.name}</span><span class="mdesc">${esc(m.blurb)}</span></button>`).join("");
}
function ruleCards() {
  const rules = STYLE_RULES.filter(r => S.ruleCat === "all" || r.category === S.ruleCat);
  return rules.map(r => card("rule", { id: r.id, name: r.title, blurb: catName(r.category) }, r.id === S.rule, r.id, true)).join("");
}
function ruleCardHtml(r) {
  return r ? `<div class="rulecard"><div class="rh"><span class="rid">${r.id}</span><strong>${esc(r.title)}</strong><span class="sev ${r.severity}">${r.severity}</span></div><div>${esc(r.rule)}</div></div>` : "";
}
function renderSteps() {
  const m = byId(MODES, S.mode); let n = 0; const out = [];
  if (m.source) {
    out.push(stepHtml(++n, !!S.source.trim(), m.source, "", "", `<textarea class="box" id="src" style="min-height:220px" placeholder="Paste a blog post, page, email or doc…">${esc(S.source)}</textarea><div class="draft-tools"><button type="button" class="mini" id="loadSample">Load sample draft</button><button type="button" class="mini" id="clearSrc">Clear</button><span class="hint${S.source.trim() ? "" : " req"}" id="srcHint" style="margin:0">${S.source.trim() ? `${S.source.trim().split(/\s+/).length} words` : "Required before you can generate"}</span></div><div id="lintWrap"></div>`));
    out.push(stepHtml(++n, !!S.focus, "Focus on…", "Rule category", "Optional · pick one", `<div class="cards">${CATEGORIES.map(c => card("focus", c, c.id === S.focus, svg(c.icon))).join("")}</div>`));
    out.push(stepHtml(++n, !!S.strict, "How strict?", "Severity", "Optional · pick one", `<div class="cards funnel">${SEVERITIES.map(s => card("strict", s, s.id === S.strict, sevSvg(s.level))).join("")}</div>`));
    out.push(stepHtml(++n, !!S.context.trim(), "Add context", "Anything Claude should know", "Optional", `<textarea class="box" id="ctx" style="min-height:90px" placeholder="Where it will run, who reads it, words the team has agreed to keep…">${esc(S.context)}</textarea>`));
  } else {
    const segs = [["all", "All"]].concat(CATEGORIES.map(c => [c.id, c.name]));
    out.push(stepHtml(++n, !!S.rule, "Pick a rule", "Rule", "Pick one", `<div class="seg" id="ruleSeg" role="group" aria-label="Filter rules" style="flex-wrap:wrap;gap:6px 16px;margin-bottom:10px">${segs.map(([k, l]) => `<button type="button" aria-pressed="${k === S.ruleCat}" data-rcat="${k}">${esc(l)}</button>`).join("")}</div><div class="cards" id="ruleCards">${ruleCards()}</div><div id="ruleCard">${ruleCardHtml(ruleOf(S.rule))}</div>`));
    out.push(stepHtml(++n, !!S.context.trim(), "Add your text", "A sentence you're unsure about", "Optional", `<textarea class="box" id="ctx" style="min-height:90px" placeholder="Paste a sentence or paragraph to check against this rule…">${esc(S.context)}</textarea>`));
  }
  const ready = m.source ? !!S.source.trim() : !!S.rule;
  const live = { check: "Check with Claude", rewrite: "Rewrite with Claude", explain: "Explain with Claude" }[m.id];
  out.push(stepHtml(++n, false, "Generate", "", "", `<div class="gen-row"><button class="pill" id="genBtn" type="button" ${ready ? "" : "disabled"}>${SAMPLE ? live : "Build my prompt"}</button><span class="gen-note" id="genNote">${SAMPLE ? "Uses your Claude account. You'll be asked to allow it the first time." : "Claude isn't connected here, so the checker writes the full prompt for you to paste into Claude, and shows a worked example. The quick check above runs right here in your browser."}</span></div><div class="summary-line" id="summaryLine">${summaryLine()}</div>`));
  out.push(stepHtml(++n, OUT.status === "done", "Output", "", "", `<div id="outWrap"></div>`));
  $("#steps").innerHTML = out.join("");
  renderLint(); renderOutput();
}
function summaryLine() {
  const m = byId(MODES, S.mode);
  const bits = m.source ? [byId(CATEGORIES, S.focus)?.name, byId(SEVERITIES, S.strict)?.name, S.source.trim() ? `${S.source.trim().split(/\s+/).length} words` : ""].filter(Boolean) : [S.rule ? `${S.rule} · ${ruleOf(S.rule)?.title}` : ""].filter(Boolean);
  return `${m.name}${bits.length ? ": " + bits.map(b => `<b>${esc(b)}</b>`).join(" · ") : " · all rules"}`;
}
function exampleFor() {
  if (S.mode !== "explain") { const ex = EXAMPLES[S.mode]; return ex ? { note: `Worked example for ${byId(MODES, S.mode).name}, run on ${ex.source} against the ${CONFIG.company} style guide.`, text: ex.text } : null; }
  const r = ruleOf(S.rule); if (!r) return null;
  if (EXAMPLES.explain[r.id]) return { note: `Worked example for Explain a rule: ${r.id}, written from the ${CONFIG.company} style guide.`, text: EXAMPLES.explain[r.id] };
  return { note: `Built from the style guide entry for ${r.id}. With Claude connected, you also get more examples, fixes and edge cases.`, text: `## ${r.id}: ${r.title}\n\n${r.rule}\n\n## Why it matters\n\n${r.why}\n\n## Do\n\n${r.do.split("\n").map(x => x.startsWith("- ") ? x : "- " + x).join("\n")}\n\n## Don't\n\n${r.dont.split("\n").map(x => x.startsWith("- ") ? x : "- " + x).join("\n")}\n\n**Severity:** ${r.severity}. **Category:** ${catName(r.category)}.${r.lint ? " The quick check flags this rule automatically." : ""}` };
}
function renderOutput() {
  const w = $("#outWrap"); if (!w) return;
  const ex = exampleFor();
  const tabs = SAMPLE ? [["out", "Output"], ["prompt", "Prompt"]] : [["prompt", "Your prompt"], ["example", "Example output"]];
  if (!tabs.find(t => t[0] === OUT.tab)) OUT.tab = tabs[0][0];
  let body = "", actions = "";
  if (OUT.tab === "prompt") {
    body = OUT.status === "idle" && !SAMPLE && !OUT.built ? `<div class="out-empty">Paste a draft or pick a rule, then click “Build my prompt.”</div>` : `<pre class="prompt" id="promptText">${esc(buildPrompt())}</pre>`;
    actions = `<button class="pill" type="button" id="copyPrompt">Copy prompt</button><a class="pill ghost" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a><span class="msg" id="copyMsg" role="status"></span>`;
  } else if (OUT.tab === "example") {
    body = ex ? `<div class="ex-note">${esc(ex.note)}</div><div class="prose">${md(ex.text)}</div>` : `<div class="out-empty">No example for this mode.</div>`;
    if (ex && revisedOf(ex.text)) actions = `<button class="pill" type="button" id="copyExRev">Copy revised version</button><span class="msg" id="copyMsg" role="status"></span>`;
  } else {
    if (OUT.status === "idle") body = `<div class="out-empty">Nothing generated yet. Paste a draft or pick a rule, then click the button above.</div>`;
    else if (OUT.status === "thinking") body = `<div class="thinking"><i></i>Claude is reading the style guide…</div>`;
    else body = `<div class="prose">${md(OUT.text)}</div>`;
    if (OUT.status === "streaming" || OUT.status === "thinking") actions = `<button class="pill ghost" type="button" id="stopBtn">Stop</button>`;
    else if (OUT.text) actions = `${revisedOf(OUT.text) ? `<button class="pill" type="button" id="copyRev">Copy revised version</button>` : ""}<button class="pill${revisedOf(OUT.text) ? " ghost" : ""}" type="button" id="copyOut">Copy all</button><button class="pill ghost" type="button" id="regen">Try another version</button>`;
    if (OUT.truncated) actions += `<span class="msg">The answer was cut short. Check a shorter section at a time.</span>`;
    if (OUT.msg) actions += `<span class="msg err">${esc(OUT.msg)}</span>`;
    actions += `<span class="msg" id="copyMsg" role="status"></span>`;
  }
  w.innerHTML = `<div class="window"><div class="window-bar"><i></i><i></i><span class="wt">${esc(summaryLine().replace(/<[^>]+>/g, ""))}</span><span class="otabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${k === OUT.tab}" data-otab="${k}">${l}</button>`).join("")}</span></div><div class="out-body" id="outBody">${body}</div>${actions ? `<div class="out-actions">${actions}</div>` : ""}</div>`;
}
function save() { store.set("state", { mode: S.mode, focus: S.focus, strict: S.strict, rule: S.rule, ruleCat: S.ruleCat, view: S.view, libDim: S.libDim }); }

/* ---------------- generation ---------------- */
async function generate(fresh) {
  if (!SAMPLE) { OUT.built = true; OUT.tab = "prompt"; renderOutput(); $("#outWrap").scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
  CTL?.abort(); CTL = new AbortController();
  OUT = { tab: "out", text: "", status: "thinking", msg: "", truncated: false }; renderOutput();
  $("#outWrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
  try {
    const r = await SAMPLE(buildPrompt(), { signal: CTL.signal, cache: fresh ? false : undefined, onText: ({ text }) => { OUT.text = text; OUT.status = "streaming"; const b = $("#outBody"); if (b && OUT.tab === "out") b.innerHTML = `<div class="prose">${md(text)}</div>`; else renderOutput(); } });
    OUT.text = r.text; OUT.truncated = r.truncated; OUT.status = "done";
  } catch (e) {
    OUT.text = e && e.code !== "refused" ? (e.text || "") : "";
    OUT.status = OUT.text ? "done" : "idle";
    const copy = { not_granted: "Claude isn't allowed for this page. Allow it from the page's permissions, or copy the prompt instead.", sampling_disabled: "Claude isn't available on this account. Copy the prompt instead.", rate_limited: "You've hit a usage limit. Try again in a little while.", session_expired: "Sign in to Claude again, then retry.", refused: "Claude declined this request. Change the draft or context and try again.", prompt_too_large: "The draft is too long. Check one section at a time.", empty_completion: "Claude returned nothing. Try again with a shorter draft.", cancelled: "" };
    OUT.msg = e && e.code in copy ? copy[e.code] : "Something interrupted the answer. Try again.";
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { SAMPLE = null; setChip(); renderSteps(); return; }
  }
  renderOutput();
}

/* ---------------- style guide view ---------------- */
function renderLibrary() {
  const segs = [["all", "All"]].concat(CATEGORIES.map(c => [c.id, c.name]));
  $("#libSeg").innerHTML = segs.map(([k, l]) => `<button type="button" aria-pressed="${k === S.libDim}" data-dim="${k}">${esc(l)}</button>`).join("");
  const q = $("#libSearch").value.trim().toLowerCase();
  const rows = STYLE_RULES.filter(r => (S.libDim === "all" || r.category === S.libDim) && (!q || JSON.stringify(r).toLowerCase().includes(q)));
  const fld = (h, v, wide, pre) => v ? `<div class="fld${wide ? " wide" : ""}"><h4>${h}</h4><p${pre ? ' style="white-space:pre-line"' : ""}>${esc(v)}</p></div>` : "";
  $("#libList").innerHTML = rows.length ? rows.map(r => `<details class="aud"><summary><span class="ib idb">${r.id}</span><span><strong>${esc(r.title)}</strong><br><span class="muted" style="font-size:13px">${esc(catName(r.category))}${r.lint ? " · in the quick check" : ""}</span></span><span class="sev ${r.severity}">${r.severity}</span></summary><div class="aud-body">
    ${fld("Rule", r.rule, true)}${fld("Why", r.why, true)}${fld("Do", r.do, false, true)}${fld("Don't", r.dont, false, true)}</div></details>`).join("") : `<div class="out-empty">No rules match “${esc(q)}”.</div>`;
  const words = WORD_LIST.filter(w => (S.libDim === "all" || S.libDim === "words" || ruleOf(w.rule)?.category === S.libDim) && (!q || JSON.stringify(w).toLowerCase().includes(q)));
  $("#wordSec").innerHTML = words.length ? `<h3>Word list</h3><div style="overflow-x:auto"><table class="wl"><tr><th>Avoid</th><th>Use</th><th>Rule</th></tr>${words.map(w => `<tr><td class="av">${esc(w.avoid)}</td><td>${esc(w.use)}</td><td><span class="rid">${w.rule}</span></td></tr>`).join("")}</table></div>` : "";
  $("#libNote").textContent = `${STYLE_RULES.length} rules in ${CATEGORIES.length} categories and ${WORD_LIST.length} word list entries. The quick check flags ${LINT_RULES().length} of the rules automatically; Claude checks them all. ${SAMPLE ? "To change the guide, ask Claude to update it and republish this page." : CONFIG.demoNote}`;
}

/* ---------------- wiring ---------------- */
function setChip() {
  $("#modeChip").classList.toggle("live", !!SAMPLE);
  $("#modeChipText").textContent = SAMPLE ? "Live · editing with Claude" : "Demo · quick check and prompt builder";
  $("#brandTag").textContent = SAMPLE ? "Style guide checker" : (CONFIG.brand?.tag || "");
}
function boot() {
  const tw = CONFIG.title.split(" ");
  $("#title").innerHTML = tw.length > 2 ? `${esc(tw.slice(0, -2).join(" "))} <span class="hl">${esc(tw.slice(-2).join(" "))}</span>` : `<span class="hl">${esc(CONFIG.title)}</span>`;
  $("#eyebrow").textContent = `For ${CONFIG.company}`;
  $("#lede").textContent = "Paste a draft and get line edits against your team's style guide, each one citing the rule it breaks.";
  document.title = CONFIG.title;
  const br = CONFIG.brand; $("#brandbar").hidden = !br;
  if (br) { const [w1, ...rest] = br.name.split(" "); $("#brandLink").innerHTML = rest.length ? `${esc(w1)} <span>${esc(rest.join(" "))}</span>` : `<span>${esc(w1)}</span>`; $("#brandLink").href = br.url || "#"; }
  $("#siteFooter").hidden = !CONFIG.footer; $("#footerText").textContent = CONFIG.footer || "";
  $("#cta").hidden = !CONFIG.ctaUrl; if (CONFIG.ctaUrl) $("#ctaLink").href = CONFIG.ctaUrl;
  setChip(); renderModes(); renderSteps(); renderLibrary(); showView(S.view);
}
function showView(v) {
  S.view = v; save();
  document.querySelectorAll("nav.views button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $("#studio").hidden = v !== "studio"; $("#library").hidden = v !== "library";
}
function copyText(text, msgEl, selEl) {
  const done = () => { if (msgEl) msgEl.textContent = "Copied."; };
  const fallback = () => { const pre = selEl || $("#promptText") || $("#outBody"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } if (msgEl) msgEl.textContent = "Selected. Press Ctrl+C or ⌘C."; };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function sourceChanged() {
  const ok = !!S.source.trim(), h = $("#srcHint");
  if (h) { h.textContent = ok ? `${S.source.trim().split(/\s+/).length} words` : "Required before you can generate"; h.classList.toggle("req", !ok); }
  const g = $("#genBtn"); if (g) g.disabled = !ok;
  const st = $("#src")?.closest(".step"); if (st) st.classList.toggle("done", ok);
  const sl = $("#summaryLine"); if (sl) sl.innerHTML = summaryLine();
  clearTimeout(lintTimer); lintTimer = setTimeout(() => { renderLint(); if (OUT.tab === "prompt") renderOutput(); }, 150);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.view) return showView(t.dataset.view);
  if (t.dataset.mode) { S.mode = t.dataset.mode; save(); OUT = { tab: OUT.tab, text: "", status: "idle", msg: "" }; renderModes(); renderSteps(); return; }
  if (t.dataset.kind) {
    const k = t.dataset.kind;
    if (k === "rule") { S.rule = t.dataset.id; save(); document.querySelectorAll('.opt[data-kind="rule"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.id === S.rule)); $("#ruleCard").innerHTML = ruleCardHtml(ruleOf(S.rule)); $("#summaryLine").innerHTML = summaryLine(); if (OUT.tab !== "out" || OUT.status === "idle") renderOutput(); return; }
    S[k] = S[k] === t.dataset.id ? "" : t.dataset.id; save();
    document.querySelectorAll(`.opt[data-kind="${k}"]`).forEach(b => b.setAttribute("aria-pressed", b.dataset.id === S[k])); t.closest(".step").classList.toggle("done", !!S[k]);
    const sl = $("#summaryLine"); if (sl) sl.innerHTML = summaryLine(); if (OUT.tab !== "out" || OUT.status === "idle") renderOutput(); return;
  }
  if (t.dataset.rcat) { S.ruleCat = t.dataset.rcat; save(); document.querySelectorAll("#ruleSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.rcat === S.ruleCat)); $("#ruleCards").innerHTML = ruleCards(); return; }
  if (t.dataset.lrule) { LINT_FILTER = LINT_FILTER === t.dataset.lrule ? "" : t.dataset.lrule; renderLint(); return; }
  if (t.dataset.otab) { OUT.tab = t.dataset.otab; renderOutput(); return; }
  if (t.dataset.dim) { S.libDim = t.dataset.dim; save(); renderLibrary(); return; }
  if (t.id === "loadSample") { S.source = SAMPLE_DRAFT; $("#src").value = S.source; LINT_FILTER = ""; sourceChanged(); return; }
  if (t.id === "clearSrc") { S.source = ""; $("#src").value = ""; LINT_FILTER = ""; sourceChanged(); $("#src").focus(); return; }
  if (t.id === "copyFlags") return copyText(lintText(FLAGS), $("#flagMsg"), $(".flags"));
  if (t.id === "genBtn") return generate(false);
  if (t.id === "regen") return generate(true);
  if (t.id === "stopBtn") { CTL?.abort(); return; }
  if (t.id === "copyPrompt") return copyText(buildPrompt(), $("#copyMsg"));
  if (t.id === "copyOut") return copyText(OUT.text, $("#copyMsg"));
  if (t.id === "copyRev") return copyText(revisedOf(OUT.text), $("#copyMsg"), $("#outBody pre"));
  if (t.id === "copyExRev") return copyText(revisedOf(exampleFor().text), $("#copyMsg"), $("#outBody pre"));
});
document.addEventListener("input", e => {
  if (e.target.id === "src") { S.source = e.target.value; sourceChanged(); }
  if (e.target.id === "ctx") { S.context = e.target.value; save(); e.target.closest(".step").classList.toggle("done", !!S.context.trim()); }
  if (e.target.id === "libSearch") renderLibrary();
});

boot();
(async () => {
  try { SAMPLE = window.claude ? await window.claude.use("sample") : null; } catch (e) { SAMPLE = null; }
  if (SAMPLE) { OUT.tab = "out"; setChip(); renderSteps(); renderLibrary(); }
  else { setChip(); }
})();
</script>

</body>
</html>
